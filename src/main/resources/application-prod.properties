server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD}}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# En esta version academica, produccion usa ddl-auto=update para permitir
# bootstrap automatico del esquema en Render. Las migraciones formales con
# Flyway/Liquibase quedan como mejora posterior.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

energycore.security.jwt.secret=${JWT_SECRET}
energycore.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://university-energycore.web.app,https://university-energycore.firebaseapp.com,http://localhost:4200}
